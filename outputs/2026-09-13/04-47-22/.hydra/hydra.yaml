hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=[/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/data/train.parquet]
    - data.val_files=[/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/data/val.parquet,/scratch/sghos104/rlpt/grpo_arms/data/vpb_dev.parquet]
    - data.train_batch_size=32
    - data.max_prompt_length=2048
    - data.max_response_length=2048
    - actor_rollout_ref.model.path=/scratch/sghos104/rlpt/src/outputs/train/coldstart_vprm_unf_3b/run_v1/checkpoints/checkpoint-25
    - actor_rollout_ref.model.trust_remote_code=True
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.actor.optim.lr=1e-06
    - actor_rollout_ref.actor.ppo_mini_batch_size=8
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_dynamic_bsz=True
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.actor.strategy=fsdp
    - actor_rollout_ref.actor.fsdp_config.param_offload=True
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
    - actor_rollout_ref.ref.fsdp_config.param_offload=True
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.n=5
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.4
    - reward_model.enable=False
    - reward_model.reward_manager=naive
    - custom_reward_function.path=/scratch/sghos104/rlpt/grpo_arms/arm_reward.py
    - custom_reward_function.name=compute_score
    - trainer.project_name=rlpt_six_arms
    - trainer.experiment_name=arm1
    - trainer.default_local_dir=/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/checkpoints
    - trainer.total_epochs=1
    - trainer.total_training_steps=60
    - trainer.save_freq=30
    - trainer.test_freq=10
    - trainer.logger=[console]
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=2
    - trainer.max_actor_ckpt_to_keep=2
    - trainer.rollout_data_dir=/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/rollouts
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=8192
    - actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=8192
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=8192
    - actor_rollout_ref.actor.kl_loss_coef=0.01
    - actor_rollout_ref.actor.clip_ratio_low=0.2
    - actor_rollout_ref.actor.clip_ratio_high=0.28
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.clip_ratio_high=0.28,actor_rollout_ref.actor.clip_ratio_low=0.2,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=True,actor_rollout_ref.actor.fsdp_config.param_offload=True,actor_rollout_ref.actor.kl_loss_coef=0.01,actor_rollout_ref.actor.optim.lr=1e-06,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=8192,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=8,actor_rollout_ref.actor.strategy=fsdp,actor_rollout_ref.actor.use_dynamic_bsz=True,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/scratch/sghos104/rlpt/src/outputs/train/coldstart_vprm_unf_3b/run_v1/checkpoints/checkpoint-25,actor_rollout_ref.model.trust_remote_code=True,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.ref.fsdp_config.param_offload=True,actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=8192,actor_rollout_ref.rollout.gpu_memory_utilization=0.4,actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=8192,actor_rollout_ref.rollout.n=5,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=grpo,custom_reward_function.name=compute_score,custom_reward_function.path=/scratch/sghos104/rlpt/grpo_arms/arm_reward.py,data.max_prompt_length=2048,data.max_response_length=2048,data.train_batch_size=32,data.train_files=[/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/data/train.parquet],data.val_files=[/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/data/val.parquet,/scratch/sghos104/rlpt/grpo_arms/data/vpb_dev.parquet],reward_model.enable=False,reward_model.reward_manager=naive,trainer.default_local_dir=/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/checkpoints,trainer.experiment_name=arm1,trainer.logger=[console],trainer.max_actor_ckpt_to_keep=2,trainer.n_gpus_per_node=2,trainer.nnodes=1,trainer.project_name=rlpt_six_arms,trainer.rollout_data_dir=/scratch/sghos104/rlpt/grpo_arms/runs/arm1_3b_ctrl_v4/rollouts,trainer.save_freq=30,trainer.test_freq=10,trainer.total_epochs=1,trainer.total_training_steps=60
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /scratch/sghos104/rlpt
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /scratch/sghos104/envs/rlpt-train/lib/python3.11/site-packages/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /scratch/sghos104/rlpt/outputs/2026-09-13/04-47-22
    choices:
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
